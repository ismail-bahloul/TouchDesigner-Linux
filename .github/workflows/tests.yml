name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static:
    name: Static tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run test suite
        run: python3 tests/test_static.py

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t td-test -f tests/Dockerfile .
      - name: Run Docker tests
        run: docker run --rm td-test

  distro-detect:
    name: Distro detect — ${{ matrix.distro.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - image: ubuntu:24.04
            name: Ubuntu 24.04
            manager: apt
          - image: ubuntu:22.04
            name: Ubuntu 22.04
            manager: apt
          - image: fedora:40
            name: Fedora 40
            manager: dnf
          - image: archlinux:latest
            name: Arch Linux
            manager: pacman
          - image: opensuse/tumbleweed:latest
            name: openSUSE Tumbleweed
            manager: zypper
    container:
      image: ${{ matrix.distro.image }}
    steps:
      - name: Install dependencies
        run: |
          case "${{ matrix.distro.manager }}" in
            apt)
              apt-get update -qq && apt-get install -y -qq python3 git curl >/dev/null
              ;;
            dnf)
              dnf install -y -q python3 git curl >/dev/null
              ;;
            pacman)
              sed -i '/\[multilib\]/,/Include/s/^#//' /etc/pacman.conf 2>/dev/null || true
              pacman -Sy --noconfirm python git curl >/dev/null
              ;;
            zypper)
              zypper install -y python3 git curl >/dev/null
              ;;
          esac
      - uses: actions/checkout@v4
      - name: Verify distro detection
        run: python3 -c "exec('from td_lib.distro import detect_distro; d = detect_distro(); print(d.distro_name + \" (\" + d.package_manager + \")\")')"
      - name: Run static tests
        run: python3 tests/test_static.py
