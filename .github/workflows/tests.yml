name: Tests

on:
  push:
    branches: [main, python-rewrite]
  pull_request:
    branches: [main]

jobs:
  static:
    name: Static tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run test suite
        run: python3 tests/test_static.py

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t td-test -f tests/Dockerfile .

      - name: Run Docker tests
        run: docker run --rm td-test
