name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static:
    name: Static tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run test suite
        run: python3 tests/test_static.py

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t td-test -f tests/Dockerfile .
      - name: Run Docker tests
        run: docker run --rm td-test

  distro-check:
    name: Distro check — ${{ matrix.distro.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - image: ubuntu:24.04
            name: Ubuntu 24.04
            manager: apt
          - image: ubuntu:22.04
            name: Ubuntu 22.04
            manager: apt
          - image: fedora:40
            name: Fedora 40
            manager: dnf
          - image: archlinux:latest
            name: Arch Linux
            manager: pacman
          - image: opensuse/tumbleweed:latest
            name: openSUSE Tumbleweed
            manager: zypper
    container:
      image: ${{ matrix.distro.image }}
    steps:
      - name: Install dependencies
        run: |
          case "${{ matrix.distro.manager }}" in
            apt)
              apt-get update -qq
              apt-get install -y -qq python3 git >/dev/null
              ;;
            dnf)
              dnf install -y -q python3 git >/dev/null
              ;;
            pacman)
              sed -i '/\[multilib\]/,/Include/s/^#//' /etc/pacman.conf 2>/dev/null || true
              pacman -Sy --noconfirm python git >/dev/null
              ;;
            zypper)
              zypper install -y python3 git >/dev/null
              ;;
          esac

      - uses: actions/checkout@v4

      - name: Verify distro detection
        run: python3 -c "from td_lib.distro import detect_distro; d = detect_distro(); assert d.package_manager == '${{ matrix.distro.manager }}'; print('  OK: ' + d.distro_name + ' (' + d.package_manager + ')')"

      - name: Check package lists are valid
        run: |
          case "${{ matrix.distro.manager }}" in
            apt)
              apt-get update -qq
              echo 'from td_lib.distro import APT_PACKAGES; import subprocess, sys; missing = [p for p in APT_PACKAGES if subprocess.run(["apt-cache", "show", p], capture_output=True, timeout=10).returncode != 0]; print("  Missing:", missing) if missing else exit(0); sys.exit(1) if missing else None; print("  OK: " + str(len(APT_PACKAGES)) + " APT packages found")' > /tmp/check_pkgs.py
              python3 /tmp/check_pkgs.py
              ;;
            dnf)
              echo 'from td_lib.distro import DNF_PACKAGES; import subprocess, sys; missing = [p for p in DNF_PACKAGES if subprocess.run(["dnf", "info", p], capture_output=True, timeout=10).returncode != 0]; print("  Missing:", missing) if missing else exit(0); sys.exit(1) if missing else None; print("  OK: " + str(len(DNF_PACKAGES)) + " DNF packages found")' > /tmp/check_pkgs.py
              python3 /tmp/check_pkgs.py
              ;;
            pacman)
              echo 'from td_lib.distro import PACMAN_PACKAGES; import subprocess, sys; alt_names = {"p7zip": "7zip"}; missing = []' > /tmp/check_pkgs.py
              echo 'for pkg in PACMAN_PACKAGES:' >> /tmp/check_pkgs.py
              echo '    check = alt_names.get(pkg, pkg)' >> /tmp/check_pkgs.py
              echo '    if subprocess.run(["pacman", "-Si", check], capture_output=True, timeout=10).returncode != 0:' >> /tmp/check_pkgs.py
              echo '        missing.append(pkg)' >> /tmp/check_pkgs.py
              echo 'if missing: print("  Missing:", missing); sys.exit(1)' >> /tmp/check_pkgs.py
              echo 'print("  OK: " + str(len(PACMAN_PACKAGES)) + " Pacman packages found")' >> /tmp/check_pkgs.py
              python3 /tmp/check_pkgs.py
              ;;
            zypper)
              echo 'from td_lib.distro import ZYPPER_BASE_PACKAGES; import subprocess, sys; missing = [p for p in ZYPPER_BASE_PACKAGES if subprocess.run(["zypper", "--non-interactive", "info", p], capture_output=True, timeout=10).returncode != 0]; print("  Missing:", missing) if missing else exit(0); sys.exit(1) if missing else None; print("  OK: " + str(len(ZYPPER_BASE_PACKAGES)) + " Zypper packages found")' > /tmp/check_pkgs.py
              python3 /tmp/check_pkgs.py
              ;;
          esac

      - name: Run static tests inside container
        run: python3 tests/test_static.py
