name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:  # Allow manual runs to verify the smoke test

jobs:
  # ── End-to-end smoke test with real Wine + winetricks ──
  weekly-smoke:
    name: Weekly smoke — real deps install
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Enable i386 and install Wine + deps
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3 curl wget xz-utils cabextract unzip p7zip-full innoextract \
            wine64 wine32 libunwind8 libunwind8:i386 xvfb file coreutils ca-certificates 2>&1 | tail -5
      - name: Run static tests first
        run: python3 tests/test_static.py
      - name: Run full install (virtual display)
        run: |
          # xvfb gives Wine a display so MS installers (vcrun2022) can run;
          # --non-interactive since stdin is not a TTY here
          xvfb-run -a ./td-install --install --non-interactive 2>&1
          echo "--- Install done ---"
      - name: Verify TouchDesigner installed
        run: |
          TD_EXE=$(find "$HOME/.local/share/touchdesigner-linux/prefix" -iname 'TouchDesigner.exe' 2>/dev/null | head -1)
          if [ -z "$TD_EXE" ]; then
            echo "❌ TouchDesigner.exe not found after install"
            exit 1
          fi
          echo "✅ TD installed: $TD_EXE"
      - name: Verify no vcrun conflict in logs
        run: |
          LOG_DIR="$HOME/.local/share/touchdesigner-linux/logs"
          if [ -d "$LOG_DIR" ]; then
            latest_log=$(ls -t "$LOG_DIR"/*.log 2>/dev/null | head -1)
            if [ -n "$latest_log" ]; then
              if grep -qi "conflict\|vcrun2019.*already installed" "$latest_log"; then
                echo "❌ vcrun conflict detected!"
                tail -30 "$latest_log"
                exit 1
              else
                echo "✅ No vcrun conflict"
              fi
              if grep -qi "error" "$latest_log"; then
                echo "⚠️  Errors in log (may be expected in headless CI)"
                grep -i "error" "$latest_log"
              fi
            fi
          fi
      - name: Diagnose
        run: td-install --diagnose 2>&1 | head -40

  distro-detect:
    name: Distro detect — ${{ matrix.distro.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - image: ubuntu:24.04
            name: Ubuntu 24.04
            manager: apt
          - image: ubuntu:22.04
            name: Ubuntu 22.04
            manager: apt
          - image: fedora:40
            name: Fedora 40
            manager: dnf
          - image: archlinux:latest
            name: Arch Linux
            manager: pacman
          - image: opensuse/tumbleweed:latest
            name: openSUSE Tumbleweed
            manager: zypper
    container:
      image: ${{ matrix.distro.image }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Install dependencies
        run: |
          case "${{ matrix.distro.manager }}" in
            apt)
              apt-get update -qq && apt-get install -y -qq python3 git curl >/dev/null
              ;;
            dnf)
              dnf install -y -q python3 git curl >/dev/null
              ;;
            pacman)
              sed -i '/\[multilib\]/,/Include/s/^#//' /etc/pacman.conf 2>/dev/null || true
              pacman -Sy --noconfirm python git curl >/dev/null
              ;;
            zypper)
              zypper install -y python3 git curl >/dev/null
              ;;
          esac
      - name: Checkout repo
        run: |
          cd /tmp && git clone --depth 1 https://github.com/iswad-lab/TouchDesigner-Linux.git td-repo && cp -a td-repo/. /__w/TouchDesigner-Linux/TouchDesigner-Linux
      - name: Verify distro detection
        run: python3 -c "exec('from td_lib.distro import detect_distro; d = detect_distro(); print(d.distro_name + \" (\" + d.package_manager + \")\")')"
      - name: Validate package lists
        run: PYTHONPATH=. python3 tests/check_packages.py
      - name: Run static tests
        run: python3 tests/test_static.py
