# Configuration wine-tkg pour Tact — TouchDesigner Wine Runner
# Basé sur Wine 11.x (Valve Proton experimental bleeding-edge)
# Seuls les patches nécessaires à TouchDesigner sont activés.
# Rien que du nécessaire, zéro bloat.

_wine_version="11.0"
_LOCAL_PRESET="valve-exp-bleeding"

# ── CRITICAL : PAS de Staging ──────────────────────────────────────────────
# Les patches Staging introduisent un rewrite DWrite qui casse les timelines
# TouchDesigner (mimalloc crash). Soda 9.0 est le dernier runner à avoir
# compris ça — on continue cette tradition.
_use_staging="false"

# ── Patches désactivés (inutiles pour TD) ────────────────────────────────────
_use_GE_patches="false"           # Patches game-specific (Assetto Corsa, MK, etc.)
_proton_battleye_support="false"  # Anti-cheat, inutile
_proton_eac_support="false"       # Anti-cheat, inutile
_mk11_fix="false"                 # Mortal Kombat 11, inutile
_quake_champions_fix="false"      # Quake Champions, inutile
_ffxivlauncher_fix="false"        # FFXIV, inutile
_re4_fix="false"                  # Resident Evil 4, inutile
_mwo_fix="false"                  # Mechwarrior Online, inutile
_assettocorsa_hudperf_fix="false" # Assetto Corsa, inutile
_launch_with_dedicated_gpu="false" # Jeux, inutile
_FS_bypass_compositor="false"     # Peut causer des bugs sur KDE, on laisse gérer par le WM
_use_wayland_driver="false"       # On force XWayland (WAYLAND_DISPLAY=""), pas besoin
_proton_winevulkan="false"        # TD utilise D3D11/DXVK, pas Vulkan direct
_proton_mf_patches="false"        # Media Foundation, non testé avec TD
_win10_default="false"            # TD gère lui-même sa version Windows
_msvcrt_nativebuiltin="false"     # Inutile

# ── Patches activés (utiles pour TD) ─────────────────────────────────────────
_proton_fs_hack="true"            # Plein écran correct
_proton_rawinput="true"           # Input fiable
_use_fsync="true"                 # Performance (kernel 5.16+)
_use_esync="true"                 # Performance (fallback si fsync pas dispo)
_use_plasma_systray_fix="true"    # KDE Plasma : correction systray
_use_josh_flat_theme="true"       # Thème moins win95, meilleur rendu UI
_protonify="true"                 # Patches Proton génériques (utiles pour compat)
